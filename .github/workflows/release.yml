name: Package and release

# 暫停自動發布：目前不呼叫 BigWigs packager、CurseForge 或 WoWInterface.
# 保留 workflow 檔案供日後人工恢復；在移除 job gate 前不得啟用。
on:
  workflow_dispatch:

jobs:

  release:

    # 暫停期間即使手動觸發，也不執行發布工作。
    if: ${{ false }}

    runs-on: ubuntu-latest

    env:
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:

      - name: Clone project
        uses: actions/checkout@v1
        with:
          fetch-depth: 50

      - name: Package and release
        uses: BigWigsMods/packager@master
        with:
          args: release.sh -w 26550 -p 826042          
